[package]
workspace = "../engine"
name = "remux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The engine, from a shell. One of the faces; the words it knows are remuxd-domain's."

# The CLI depends on the domain and the wire and nothing else: it builds in
# seconds and without an Apple framework, which is how a face should be. The
# wire is for `remux login`, the one thing it says to the web.
[dependencies]
remuxd-domain = { path = "../engine/domain" }
remux-wire = { path = "../engine/wire" }
serde_json = { workspace = true }
