# remux is open source, not open contribution: the owners write the code, and a
# pull request from anybody else is closed when it is opened, with a word on
# where to go instead. An issue is welcome; a patch in one is read as an idea,
# and may be rewritten from scratch. The owners are .github/CODEOWNERS's;
# Dependabot keeps the pinned actions and crates moving and stays.
#
# pull_request_target, so a pull request from a fork gets a token that may close
# it. Nothing of the pull request is checked out or run: the job reads its
# author and talks to the API, no more.
name: pull requests
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  owners-only:
    if: >-
      !contains(fromJSON('["leandronsp", "molvrr", "dependabot[bot]"]'),
      github.event.pull_request.user.login)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({ owner, repo, issue_number: pull_number,
              body: "Thank you, but remux does not take pull requests: it is open source, not open contribution, and only its two maintainers write the code. Issues are welcome: open one with the bug or the idea (a patch in it is fine as an illustration, and may be rewritten from scratch)." });
            await github.rest.pulls.update({ owner, repo, pull_number, state: "closed" });
