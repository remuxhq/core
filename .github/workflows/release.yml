# The release, published once ci is green on main: every green run of ci on
# main runs it, and it publishes the version engine/cli/Cargo.toml says unless
# that version is already released, so only a merge that moves the version
# publishes. A dispatch runs it again for a version whose run failed. It checks the
# notes and the version, builds one tarball per target on a machine of that
# target (scripts/release.sh) from the commit that set the version, then tags
# that commit and publishes the release with the notes as its body. ci.yml is
# what checks a pull request.
#
# Every action is pinned by commit, with the release beside it.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One run that can publish at a time, so two never race to the same tag. A run
# that cannot publish (ci red, a pull request) takes a group of its own and never
# evicts one waiting to.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  # The notes are the record of why a release is what it is, and nothing
  # generates a why: the version engine/cli/Cargo.toml says, without
  # docs/releases/<version>.md, is refused before a build. The release is the
  # commit that set the version (one per pull request, squashed), not the one
  # ci checked: a merge that lands after it, before it is published, stays out.
  notes:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci checked, or main's head on a dispatch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/cli/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version is already released"; echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git log -1 --format=%H -S"version = \"$version\"" -- engine/cli/Cargo.toml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git show "$sha:docs/releases/$version.md" | grep -q . || { echo "no notes: write docs/releases/$version.md"; exit 1; }
  build:
    needs: notes
    if: needs.notes.outputs.released != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: stable
      # The distribution's libobs, linked straight (release.sh sets LIBOBS_PATH).
      - name: libobs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq obs-studio libobs-dev
      - name: OBS.app (macOS)
        if: runner.os == 'macOS'
        run: make obs.fetch
      # OBS's headers reach for simde on ARM; the bindings are generated from them.
      - name: simde (macOS)
        if: runner.os == 'macOS'
        run: brew install simde
      - run: sh scripts/release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # The tag is made here, on the commit that was built, never by hand.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.notes.outputs.version }}
          target_commitish: ${{ needs.notes.outputs.sha }}
          name: remux ${{ needs.notes.outputs.version }}
          body_path: docs/releases/${{ needs.notes.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
