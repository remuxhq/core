# The release. It runs when a merge to main touches engine/cli/Cargo.toml,
# which only a release pull request does (ci.yml's release guard: an owner, a
# release/ branch, the notes), after that pull request passed lint, unit, sec
# and integration on both operating systems. It publishes the version
# engine/cli/Cargo.toml says unless it is already released. An owner can
# dispatch it again for a version whose run failed; nobody else can.
#
# It checks the notes and the version, builds one tarball per target on a
# machine of that target (scripts/release.sh) from the commit that set the
# version, attests each tarball, then tags that commit and publishes the
# release with the notes as its body. A version with a pre-release part
# (0.3.0-rc.1) is published as a pre-release and never becomes the latest,
# so install.sh and the site, which read the latest, keep the stable one.
#
# Every action is pinned by commit, with the release beside it.
name: release
on:
  push:
    branches: [main]
    paths: [engine/cli/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two never race to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The notes are the record of why a release is what it is, and nothing
  # generates a why: the version engine/cli/Cargo.toml says, without
  # docs/releases/<version>.md, is refused before a build. The release is the
  # commit that set the version (one per pull request, squashed), not the one
  # ci checked: a merge that lands after it, before it is published, stays out.
  notes:
    # The owners, as .github/CODEOWNERS names them.
    if: >-
      github.event_name == 'push' ||
      (github.ref == 'refs/heads/main' && contains(fromJSON('["leandronsp", "molvrr"]'), github.actor))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/cli/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version is already released"; echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git log -1 --format=%H -S"version = \"$version\"" -- engine/cli/Cargo.toml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git show "$sha:docs/releases/$version.md" | grep -q . || { echo "no notes: write docs/releases/$version.md"; exit 1; }
  build:
    needs: notes
    if: needs.notes.outputs.released != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # The attestation is signed with this run's identity (id-token) and kept
    # by GitHub (attestations): `gh attestation verify` proves a tarball came
    # from this workflow, on this commit.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: stable
      # The distribution's libobs, linked straight (release.sh sets LIBOBS_PATH).
      - name: libobs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq obs-studio libobs-dev
      - name: OBS.app (macOS)
        if: runner.os == 'macOS'
        run: make obs.fetch
      # OBS's headers reach for simde on ARM; the bindings are generated from them.
      - name: simde (macOS)
        if: runner.os == 'macOS'
        run: brew install simde
      - run: sh scripts/release.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notes.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # The tag is made here, on the commit that was built, never by hand.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.notes.outputs.version }}
          target_commitish: ${{ needs.notes.outputs.sha }}
          name: remux ${{ needs.notes.outputs.version }}
          body_path: docs/releases/${{ needs.notes.outputs.version }}.md
          prerelease: ${{ needs.notes.outputs.prerelease }}
          make_latest: ${{ needs.notes.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
