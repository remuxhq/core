# The release, run by hand and only by hand: the release skill dispatches it
# once the version's pull request is merged (docs/release.md). It checks the
# notes and the version, builds one tarball per target on a machine of that
# target (scripts/release.sh), then tags the commit it built and publishes the
# release with the notes as its body. A push, a tag or a pull request starts
# nothing here; ci.yml is what checks a pull request.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, as engine/cli/Cargo.toml says it (0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # The notes are the record of why a release is what it is, and nothing
  # generates a why: a version without docs/releases/<version>.md, one that
  # disagrees with the binaries, or one already released is refused before a
  # build.
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "$VERSION is not a version"; exit 1; }
          said=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/cli/Cargo.toml | head -1)
          test "$VERSION" = "$said" || { echo "asked for $VERSION, engine/cli/Cargo.toml says $said"; exit 1; }
          test -s "docs/releases/$VERSION.md" || { echo "no notes: write docs/releases/$VERSION.md"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then echo "v$VERSION is already released"; exit 1; fi
  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The distribution's libobs, linked straight (release.sh sets LIBOBS_PATH).
      - name: libobs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq obs-studio libobs-dev
      - name: OBS.app (macOS)
        if: runner.os == 'macOS'
        run: make obs.fetch
      # OBS's headers reach for simde on ARM; the bindings are generated from them.
      - name: simde (macOS)
        if: runner.os == 'macOS'
        run: brew install simde
      - run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag is made here, on the commit that was built, never by hand.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: remux ${{ inputs.version }}
          body_path: docs/releases/${{ inputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
