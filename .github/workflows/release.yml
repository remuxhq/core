# The release: one tarball per target, each built on a machine of that
# target by scripts/release.sh, attached to the GitHub release of the tag.
# `v0.1.0` tags it; "Run workflow" builds the same without a release, to see.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # The build alone, whenever what goes into a release changes.
  pull_request:
    paths:
      - scripts/release.sh
      - install.sh
      - install-relay.sh
      - install-chat.sh
      - uninstall.sh
      - .github/workflows/release.yml
      - engine/motor-obs/**
      - engine/remuxd/build.rs

permissions:
  contents: write

jobs:
  # The notes are the record of why a release is what it is, and nothing
  # generates a why: a tag without docs/releases/<version>.md, or one that
  # disagrees with the version the binaries say, is refused before a build.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="${GITHUB_REF_NAME#v}"
          said=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          test "$version" = "$said" || { echo "the tag says $version, cli/Cargo.toml says $said"; exit 1; }
          test -s "docs/releases/$version.md" || { echo "no notes: write docs/releases/$version.md"; exit 1; }
  build:
    needs: notes
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libobs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq obs-studio
      - name: OBS.app (macOS)
        if: runner.os == 'macOS'
        run: make obs.fetch
      - run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: remux ${{ steps.tag.outputs.version }}
          body_path: docs/releases/${{ steps.tag.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
