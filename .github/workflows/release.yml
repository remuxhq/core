# The release, published when a merge to main moves the version: the push that
# changes engine/cli/Cargo.toml runs it, and a version already released is left
# alone. A dispatch runs it again for a version whose run failed. It checks the
# notes and the version, builds one tarball per target on a machine of that
# target (scripts/release.sh), then tags the commit it built and publishes the
# release with the notes as its body. ci.yml is what checks a pull request.
name: release
on:
  push:
    branches: [main]
    paths: [engine/cli/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The notes are the record of why a release is what it is, and nothing
  # generates a why: the version engine/cli/Cargo.toml says, without
  # docs/releases/<version>.md, is refused before a build.
  notes:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/cli/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version is already released"; echo "released=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test -s "docs/releases/$version.md" || { echo "no notes: write docs/releases/$version.md"; exit 1; }
  build:
    needs: notes
    if: needs.notes.outputs.released != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The distribution's libobs, linked straight (release.sh sets LIBOBS_PATH).
      - name: libobs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq obs-studio libobs-dev
      - name: OBS.app (macOS)
        if: runner.os == 'macOS'
        run: make obs.fetch
      # OBS's headers reach for simde on ARM; the bindings are generated from them.
      - name: simde (macOS)
        if: runner.os == 'macOS'
        run: brew install simde
      - run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag is made here, on the commit that was built, never by hand.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: remux ${{ needs.notes.outputs.version }}
          body_path: docs/releases/${{ needs.notes.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
