[package]
name = "remux-shader"
version = "0.3.0-rc.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The domain's ShaderCompiler over naga: an operator's WGSL filter, checked against the contract, as an OBS effect."

[dependencies]
# The domain, for the port this crate implements and the contract it checks.
remuxd-domain = { path = "../domain" }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
