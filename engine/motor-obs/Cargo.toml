[package]
name = "motor-obs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The libobs motor. Not in the workspace: it needs OBS installed."

# Its own workspace, on purpose: the engine's workspace must build on a
# machine with no OBS, and this crate links against /Applications/OBS.app.
[workspace]

[dependencies]
remuxd-domain = { path = "../domain" }
remux-wire = { path = "../wire" }
# libobs's own C API, generated from the headers of the OBS it names (32.1):
# no struct, constant or signature is written by hand here.
libobs = { git = "https://github.com/libobs-rs/libobs-rs", rev = "f5d2ce610fbf2066b19b8f7dfbd94f85784d892f" }
# Filters are WGSL, the contract both motors share, written out as an OBS
# effect by their own crate.
remux-shader = { path = "../shader" }
libc = "0.2"
serde_json = "1"
jpeg-encoder = "0.7"
png = "0.18"
