[package]
name = "motor-obs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The libobs motor. Not in the workspace: it needs OBS installed."

# Its own workspace, on purpose: the engine's workspace must build on a
# machine with no OBS, and this crate links against /Applications/OBS.app.
[workspace]

[dependencies]
remuxd-domain = { path = "../domain" }
remux-wire = { path = "../wire" }
libc = "0.2"
serde_json = "1"
jpeg-encoder = "0.7"
png = "0.18"
