[package]
name = "remux"
version = "0.2.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The engine, from a shell. One of the faces: the words (`words`), the socket and the service."

# The CLI depends on the domain and the wire, and on what the words print
# (base64 for a shot, schemars for `remux schema`): it builds in seconds and
# without an Apple framework, which is how a face should be. The wire is for
# `remux login`, the one thing it says to the web.
[dependencies]
remuxd-domain = { path = "../domain" }
remux-wire = { path = "../wire" }
base64 = "0.22"
libc = "0.2"
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
