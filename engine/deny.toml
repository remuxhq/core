# cargo-deny: advisories, bans and sources for the engine's dependency graph.
# Licenses are not checked here: the product is proprietary and the graph is
# serde, objc2 bindings and a handful of MIT/Apache crates; a licence review
# is a release step, not a gate.

[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# the workspace crates point at each other by path, with no version: that is
# the one wildcard a workspace has
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# libobs's C API generated from OBS 32.1's headers (the motor's bindings), at a
# pinned commit of the libobs-rs main branch: the release on crates.io trails it.
allow-git = ["https://github.com/libobs-rs/libobs-rs"]
