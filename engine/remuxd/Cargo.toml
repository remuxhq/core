[package]
name = "remuxd"
version = "0.3.0-rc.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The remux engine: captures, mixes, encodes, publishes and records. No interface."

[features]
# The libobs motor is the one this daemon ships with; another motor's binary
# depends on this crate with `default-features = false` and brings its own.
default = ["obs"]
obs = ["dep:motor-obs", "dep:remux-shader", "dep:remux-mixer"]

# The daemon and the socket tests that spawn it need the libobs motor; the
# library and its unit tests do not, so `--no-default-features` builds and
# tests the engine on a machine with no OBS.
[[bin]]
name = "remuxd"
path = "src/main.rs"
required-features = ["obs"]

[[test]]
name = "socket"
required-features = ["obs"]

[dependencies]
remuxd-domain = { path = "../domain" }
remux-wire = { path = "../wire" }
# The libobs motor links against the OBS on this machine.
motor-obs = { path = "../motor-obs", optional = true }
# The filters the libobs motor hosts: this binary is the one place that knows
# both the motor and the adapters, and injects the adapters into it.
remux-shader = { path = "../shader", optional = true }
remux-mixer = { path = "../mixer", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tungstenite = { workspace = true }
