# A relay of one's own, as docs/relay.md describes: one path in, one egress
# out per platform, no API needed. The engine publishes `scene`; the egress
# pushes it to the platform as `live/relayed`.
api: yes
apiAddress: :9997
rtmp: yes
rtmpAddress: :1935
rtsp: yes
rtspAddress: :8554
hls: no
webrtc: no
srt: no
authMethod: internal
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: api
paths:
  scene:
    runOnReady: /egress rtsp://localhost:8554/scene rtmp://platform:1935/live/relayed
    runOnReadyRestart: yes
  all_others:
