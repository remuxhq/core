# The lab for the free flow: a platform that is only an RTMP door, and a
# relay of one's own built the way docs/relay.md says. `make smoke.lab.up`,
# then `make remuxd.smoke S=free` and `S=byo`. Loopback only.
services:
  platform:
    image: bluenviron/mediamtx:latest
    container_name: remux-lab-platform
    ports:
      - "127.0.0.1:1937:1935"   # RTMP in, what Twitch or YouTube would be
      - "127.0.0.1:9998:9997"   # its API, what the smokes read
    volumes:
      - ./platform.yml:/mediamtx.yml:ro

  relay:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: remux-lab-relay
    init: true
    depends_on: [platform]
    ports:
      - "127.0.0.1:1938:1935"   # RTMP in, from the engine
      - "127.0.0.1:9996:9997"   # its API
    volumes:
      - ./relay.yml:/mediamtx.yml:ro
      - ./egress:/egress:ro
